<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="LLM Protocol Gateway">
  <title>LLM Protocol Gateway</title>
  <defs>
    <linearGradient id="lpg-chassis" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#131728"/>
      <stop offset="35%" stop-color="#0b0f1d"/>
      <stop offset="70%" stop-color="#060812"/>
      <stop offset="100%" stop-color="#020306"/>
    </linearGradient>
    <linearGradient id="lpg-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8"/>
      <stop offset="30%" stop-color="#818cf8" stop-opacity="0.5"/>
      <stop offset="70%" stop-color="#f43f5e" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="lpg-bevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.7"/>
    </linearGradient>
    <radialGradient id="lpg-glow-warm" cx="78%" cy="22%" r="65%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.38"/>
      <stop offset="40%" stop-color="#d946ef" stop-opacity="0.18"/>
      <stop offset="70%" stop-color="#fbbf24" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lpg-glow-cool" cx="22%" cy="78%" r="65%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.4"/>
      <stop offset="45%" stop-color="#2563eb" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lpg-glow-core" cx="50%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="40%" stop-color="#818cf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="lpg-mobius-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.85"/>
    </filter>
    <filter id="lpg-crossover-depth" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="-8" dy="12" stdDeviation="12" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <rect x="20" y="20" width="472" height="472" rx="108" fill="url(#lpg-chassis)" stroke="url(#lpg-rim)" stroke-width="2.5"/>
  <rect x="32" y="32" width="448" height="448" rx="98" fill="none" stroke="url(#lpg-bevel)" stroke-width="1.2" opacity="0.75"/>
  <circle cx="360" cy="160" r="180" fill="url(#lpg-glow-warm)"/>
  <circle cx="150" cy="350" r="180" fill="url(#lpg-glow-cool)"/>
  <circle cx="256" cy="256" r="130" fill="url(#lpg-glow-core)"/>
  <circle cx="256" cy="256" r="165" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="6 8" opacity="0.08"/>

  <g id="lpg-mark">
    <g transform="rotate(34 256 256)">
      <ellipse cx="256" cy="256" rx="152" ry="76" fill="none" stroke="#ffffff" stroke-width="53" opacity="0.9"/>
      <ellipse cx="256" cy="256" rx="152" ry="76" fill="none" stroke="#080c16" stroke-width="50"/>
      <ellipse cx="256" cy="256" rx="152" ry="76" fill="none" stroke="#ffffff" stroke-width="7"/>
    </g>
    <g transform="rotate(-34 256 256)" filter="url(#lpg-mobius-shadow)">
      <ellipse cx="256" cy="256" rx="152" ry="76" fill="none" stroke="#ffffff" stroke-width="50"/>
      <ellipse cx="256" cy="256" rx="152" ry="76" fill="none" stroke="#080c16" stroke-width="7"/>
    </g>
    <g transform="rotate(34 256 256)" filter="url(#lpg-crossover-depth)">
      <path d="M 408,256 A 152,76 0 0,1 104,256" fill="none" stroke="#ffffff" stroke-width="53" opacity="0.9"/>
      <path d="M 408,256 A 152,76 0 0,1 104,256" fill="none" stroke="#080c16" stroke-width="50"/>
      <path d="M 408,256 A 152,76 0 0,1 104,256" fill="none" stroke="#ffffff" stroke-width="7"/>
    </g>
    <circle cx="256" cy="256" r="10" fill="#ffffff"/>
    <circle cx="256" cy="256" r="5" fill="#080c16"/>
  </g>
</svg>
