name: debug-desktop

# 临时诊断：复现 release 里 desktop 三个平台的构建失败，把日志写回 commit message。
on:
  push:
    branches: [debug-desktop]

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
          cache-dependency-path: |
            go.sum
            desktop/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgtk-3-dev libwebkit2gtk-4.1-dev xvfb || true
      - name: build
        run: |
          set +e
          : > /tmp/d.txt
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0 >> /tmp/d.txt 2>&1
          echo "wails_install=$?" >> /tmp/d.txt
          npm ci --no-audit --no-fund --prefix web >> /tmp/d.txt 2>&1
          GATEWAY_APP_VERSION=0.4.0-ci-test npm --prefix web run build >> /tmp/d.txt 2>&1
          echo "web_build=$?" >> /tmp/d.txt
          node desktop/frontend/sync-dist.mjs >> /tmp/d.txt 2>&1
          cd desktop
          wails build -tags webkit2_41 -ldflags "-X github.com/luca/llm-protocol-gateway/internal/gateway.BuildVersion=0.4.0-ci-test" >> /tmp/d.txt 2>&1
          echo "wails_build=$?" >> /tmp/d.txt
          tail -c 20000 /tmp/d.txt > /tmp/tail.txt
          tail -40 /tmp/tail.txt
      - name: 写回
        if: always()
        run: |
          git config user.name "d-dev" && git config user.email "d-dev@users.noreply.github.com"
          { echo "debug: desktop-linux [skip ci]"; echo; echo '```'; cat /tmp/tail.txt; echo '```'; } > /tmp/m.txt
          git commit --allow-empty -q -F /tmp/m.txt && git push
